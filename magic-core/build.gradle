plugins {
	id 'java-library'
	id 'java-test-fixtures'
}
group = rootProject.group
version = rootProject.version
repositories { mavenCentral() }
java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}
sourceSets {
	moduleTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}
configurations {
	moduleTestImplementation.extendsFrom testImplementation
	moduleTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
	moduleTestImplementation testFixtures(project(':magic-core'))
	testImplementation platform('org.junit:junit-bom:5.12.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.register('moduleTest', Test) {
	description = 'Real core modules with in-memory ports; does not launch Minecraft.'
	testClassesDirs = sourceSets.moduleTest.output.classesDirs
	classpath = sourceSets.moduleTest.runtimeClasspath
	shouldRunAfter test
}
tasks.named('check') { dependsOn tasks.named('moduleTest') }
